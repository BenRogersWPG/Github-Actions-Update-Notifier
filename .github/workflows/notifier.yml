name: List of Actions to Monitor
permissions:
  contents: read
  pull-requests: write

# INSTRUCTIONS:
## ADD your actions to the list below
## REMOVE any existing actions you don't want to monitor
### Update Levels:
  #^ Monitor all releases (even patch releases) by specifying the full version:
    #- uses: actions/checkout@v6.0.3
  ### or
  #^ Monitor only full releases, by just including the top level number:
    #- uses: actions/checkout@v6
  ### or
  #^ Monitor specific sha-pinned version (most secure), by adding the commit sha directly (followed by the version in comments):
    #-uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

on:
  workflow_dispatch:

jobs:

  run_update_notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Cache Python environment
        id: cache-python-env-patches
        uses: actions/cache@v6.1.0
        with:
          path: ~/.venv
          key: ${{ runner.os }}-notifier-python
          restore-keys: ${{ runner.os }}-notifier-python-

      - name: Setup Python
        if: steps.cache-python-env-patches.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: 'typescript'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3

      - name: create issue 0
        id: wr0
        if: ${{ env.RESULTFOUND0 > 0 }}
        uses: dacbd/create-issue-action@v2.0.0
        with:
          token: ${{ github.token }}
          title: Test
          body: |
            Test

      - name: create issue 1
        id: wr1
        if: ${{ env.RESULTFOUND0 > 0 }}
        uses: BenRogersWPG/create-issue-action@v1.0.4
        with:
          token: ${{ github.token }}
          title: Test
          body: |
            Test

      - name: update issue 0
        if: ${{ env.RESULTFOUND0 > 0 }}
        uses: julien-deramond/update-issue-body@v1.1.0
        with:
          issue-number: ${{ steps.wr0.outputs.number }}
          body: |
            test
          edit-mode: replace

      - name: update issue 1
        if: ${{ env.RESULTFOUND0 > 0 }}
        uses: BenRogersWPG/update-issue-body@v2.0.2
        with:
          issue-number: ${{ steps.wr1.outputs.number }}
          body: |
            test
          edit-mode: replace

      - name: Upload JSON file
        uses: actions/upload-artifact@v7.0.2
        with:
          name: readme
          path: README.md

      - name: Get Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: env-vars


      - name: Script
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const repo = context.repo.repo;

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
